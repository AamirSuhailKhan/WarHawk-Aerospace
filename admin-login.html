<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#060B12">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Portal Login — Warhawk Aerospace</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #060B12;
      --card-bg: #0D1622;
      --border: #1E3147;
      --text: #F3F7FA;
      --muted: #8E9EAF;
      --accent-blue: #408DD8;
      --accent-lime: #C9FF5E;
      --error: #FF5A5A;
      --font-sans: 'Manrope', -apple-system, sans-serif;
      --font-display: 'Barlow Condensed', sans-serif;
      --font-mono: 'DM Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }
    .grid-bg {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(64, 141, 216, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(64, 141, 216, 0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }
    .glow {
      position: absolute;
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(64, 141, 216, 0.12) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .login-card {
      position: relative;
      z-index: 10;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.04);
    }
    .brand-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 32px;
      text-decoration: none;
      color: var(--text);
    }
    .brand-logo {
      width: 42px;
      height: 42px;
      object-fit: contain;
    }
    .brand-text {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.06em;
      line-height: 1;
    }
    .brand-text small {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.18em;
      color: var(--muted);
      margin-top: 3px;
    }
    .login-title {
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.01em;
      margin-bottom: 8px;
    }
    .login-sub {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 28px;
      line-height: 1.5;
    }
    .field {
      margin-bottom: 20px;
    }
    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }
    .field input {
      width: 100%;
      background: #080D15;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      color: #FFF;
      font-family: var(--font-sans);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(64, 141, 216, 0.18);
    }
    .error-box {
      background: rgba(255, 90, 90, 0.12);
      border: 1px solid rgba(255, 90, 90, 0.35);
      color: #FF8F8F;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }
    .btn-submit {
      width: 100%;
      background: var(--accent-lime);
      color: #060B12;
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.06em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-submit:hover {
      background: #D8FF80;
    }
    .btn-submit:active {
      transform: translateY(1px);
    }
    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .footer-note {
      margin-top: 28px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      font-family: var(--font-mono);
    }
    .footer-note a {
      color: var(--accent-blue);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="glow"></div>

  <div class="login-card">
    <a href="/" class="brand-header">
      <img src="assets/warhawk-emblem.png" alt="Warhawk Logo" class="brand-logo">
      <div class="brand-text">
        WARHAWK
        <small>AEROSPACE</small>
      </div>
    </a>

    <h1 class="login-title">COMMAND PORTAL</h1>
    <p class="login-sub">Authorized enterprise operations & sales management access only.</p>

    <div id="errorBox" class="error-box" role="alert"></div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="username">Operator / Username</label>
        <input type="text" id="username" name="username" required autocomplete="username" placeholder="e.g. admin">
      </div>
      <div class="field">
        <label for="password">Security Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••••••">
      </div>
      <button type="submit" id="submitBtn" class="btn-submit">
        <span id="btnText">AUTHENTICATE SESSION</span>
        <span aria-hidden="true">→</span>
      </button>
    </form>

    <div class="footer-note">
      WARHAWK AEROSPACE DaaS PLATFORM<br>
      <a href="/">← Return to Public Site</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('errorBox');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      errorBox.textContent = '';

      const username = form.username.value.trim();
      const password = form.password.value;

      if (!username || !password) {
        errorBox.textContent = 'Please enter both username and password.';
        errorBox.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      btnText.textContent = 'VERIFYING CREDENTIALS...';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (!res.ok || !data.ok) {
          errorBox.textContent = data.error || 'Authentication failed. Please verify credentials.';
          errorBox.style.display = 'block';
          submitBtn.disabled = false;
          btnText.textContent = 'AUTHENTICATE SESSION';
          return;
        }

        // Success -> redirect to admin dashboard
        window.location.href = '/admin';
      } catch (err) {
        errorBox.textContent = 'Connection error. Unable to contact authentication server.';
        errorBox.style.display = 'block';
        submitBtn.disabled = false;
        btnText.textContent = 'AUTHENTICATE SESSION';
      }
    });
  </script>
</body>
</html>
